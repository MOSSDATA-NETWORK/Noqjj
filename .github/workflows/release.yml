name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Upload static
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: backend/static/

  build-linux-x86_64:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Download static
        uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: backend/static/
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build
        run: |
          cd backend
          cargo build --release --target x86_64-unknown-linux-gnu
      - name: Rename
        run: cp backend/target/x86_64-unknown-linux-gnu/release/chicken-detect-backend noqjj-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: noqjj-linux-x86_64
          path: noqjj-linux-x86_64

  build-linux-aarch64:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Download static
        uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: backend/static/
      - name: Build
        run: |
          cd backend
          cross build --release --target aarch64-unknown-linux-gnu
      - name: Rename
        run: cp backend/target/aarch64-unknown-linux-gnu/release/chicken-detect-backend noqjj-linux-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: noqjj-linux-aarch64
          path: noqjj-linux-aarch64

  build-macos:
    needs: build-frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Download static
        uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: backend/static/
      - name: Build
        run: |
          cd backend
          cargo build --release --target aarch64-apple-darwin
      - name: Rename
        run: cp backend/target/aarch64-apple-darwin/release/chicken-detect-backend noqjj-macos-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: noqjj-macos-aarch64
          path: noqjj-macos-aarch64

  release:
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set git identity
        run: |
          git config user.name "Mossdata"
          git config user.email "mossdata@users.noreply.github.com"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "${{ github.ref_name }}" --json tagName 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Create or update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/noqjj-linux-x86_64/noqjj-linux-x86_64
            artifacts/noqjj-linux-aarch64/noqjj-linux-aarch64
            artifacts/noqjj-macos-aarch64/noqjj-macos-aarch64
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
