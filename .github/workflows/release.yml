name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Upload static
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: backend/static/

  build-linux-x86_64:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Download static
        uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: backend/static/
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build
        run: |
          cd backend
          cargo build --release --target x86_64-unknown-linux-gnu
      - name: Rename
        run: cp backend/target/x86_64-unknown-linux-gnu/release/chicken-detect-backend noqjj-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: noqjj-linux-x86_64
          path: noqjj-linux-x86_64

  build-linux-aarch64:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Download static
        uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: backend/static/
      - name: Install cross-compilation tools
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config libssl-dev:arm64
      - name: Configure linker
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> .cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml
          echo 'rustflags = ["-L", "/usr/lib/aarch64-linux-gnu"]' >> .cargo/config.toml
      - name: Set env for pkg-config
        run: |
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/include" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=/usr/lib/aarch64-linux-gnu" >> $GITHUB_ENV
      - name: Build
        run: |
          cd backend
          cargo build --release --target aarch64-unknown-linux-gnu
      - name: Rename
        run: cp backend/target/aarch64-unknown-linux-gnu/release/chicken-detect-backend noqjj-linux-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: noqjj-linux-aarch64
          path: noqjj-linux-aarch64

  build-macos:
    needs: build-frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Download static
        uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: backend/static/
      - name: Build
        run: |
          cd backend
          cargo build --release --target aarch64-apple-darwin
      - name: Rename
        run: cp backend/target/aarch64-apple-darwin/release/chicken-detect-backend noqjj-macos-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: noqjj-macos-aarch64
          path: noqjj-macos-aarch64

  release:
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            artifacts/noqjj-linux-x86_64/noqjj-linux-x86_64
            artifacts/noqjj-linux-aarch64/noqjj-linux-aarch64
            artifacts/noqjj-macos-aarch64/noqjj-macos-aarch64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
