name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: noqjj-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: noqjj-linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: noqjj-macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build backend (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: |
          cd backend
          cargo build --release --target ${{ matrix.target }}

      - name: Build backend (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cd backend
          cross build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          cp backend/target/${{ matrix.target }}/release/chicken-detect-backend ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            artifacts/noqjj-linux-x86_64/noqjj-linux-x86_64
            artifacts/noqjj-linux-aarch64/noqjj-linux-aarch64
            artifacts/noqjj-macos-aarch64/noqjj-macos-aarch64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
